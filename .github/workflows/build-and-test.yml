name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.API.sln

    - name: Build
      run: dotnet build RaceDay.API.sln --no-restore --configuration Release

    - name: Run tests
      run: |
        mapfile -t test_projects < <(find RaceDay.Tests -type f -name "*.csproj")

        if [ ${#test_projects[@]} -eq 0 ]; then
          echo "No test projects found under RaceDay.Tests. Skipping test execution."
          exit 0
        fi

        for project in "${test_projects[@]}"; do
          dotnet test "$project" --configuration Release --verbosity normal
        done
